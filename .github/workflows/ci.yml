name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The test-slot tests run `cargo heli nextest run`.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # TEMPORARY (fix/stale-link): the precise look test, over and over,
      # alone and beside the other recycling tests. Removed before merging.
      - name: stale-link loop
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo test --locked --test recycle --no-run
          fails=0
          for i in $(seq 40); do
            if ! cargo test --locked --test recycle -- --exact the_look_recycles_precisely_for_an_older_worktree_without_the_donors_code > out.txt 2>&1; then
              fails=$((fails+1)); echo "=== alone, run $i failed"; sed -n '/panicked/,$p' out.txt
            fi
          done
          for i in $(seq 10); do
            if ! cargo test --locked --test recycle > out.txt 2>&1; then
              fails=$((fails+1)); echo "=== with the others, run $i failed"; sed -n '/^failures:/,$p' out.txt
            fi
          done
          echo "failed runs: $fails"
          test "$fails" -eq 0
      - name: test
        if: always()
        run: cargo test --locked --no-fail-fast
