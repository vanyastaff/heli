name: Dependency epoch experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - experiments/package-epoch-views.py
      - experiments/real-download-hol.py
      - experiments/isolated-home-concurrency.py
      - experiments/flui-worktree-acceptance.py
      - experiments/flui-mixed-project-sidecar.py
      - experiments/test_flui_worktree_acceptance.py
      - docs/research/package-epoch-views.md
      - .github/workflows/dependency-epochs.yml
  push:
    branches: [main]
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - experiments/package-epoch-views.py
      - experiments/real-download-hol.py
      - experiments/isolated-home-concurrency.py
      - experiments/flui-worktree-acceptance.py
      - experiments/flui-mixed-project-sidecar.py
      - experiments/test_flui_worktree_acceptance.py
      - docs/research/package-epoch-views.md
      - .github/workflows/dependency-epochs.yml

permissions:
  contents: read

jobs:
  package-views:
    name: Package views (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax-check worktree acceptance drivers
        run: python -c "from pathlib import Path; [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in (Path('experiments/flui-worktree-acceptance.py'), Path('experiments/flui-mixed-project-sidecar.py'), Path('experiments/test_flui_worktree_acceptance.py'))]"
      - name: Test worktree acceptance driver safety
        run: python experiments/test_flui_worktree_acceptance.py
      - name: Inspect the full-worktree plan without starting a workload
        run: python experiments/flui-worktree-acceptance.py --heli "${{ runner.temp }}/unused-heli" --flui "${{ runner.temp }}/unused-flui" --flui-ref "0000000000000000000000000000000000000000" --budget-mb 8192 --output "${{ runner.temp }}/heli-acceptance-prepare-only" --instrument
      - name: Verify the plan created no lab
        run: python -c "import os; from pathlib import Path; assert not (Path(os.environ['RUNNER_TEMP']) / 'heli-acceptance-prepare-only').exists()"
      - name: Inspect mixed-project driver arguments
        run: python experiments/flui-mixed-project-sidecar.py --help
      - name: Test shared package objects and active view retirement
        run: python experiments/package-epoch-views.py --prepare-vendor --toolchain stable --output "${{ runner.temp }}/heli-package-epoch-views"
      - name: Build the public Heli CLI
        run: cargo build --locked --bin cargo-heli
      - name: Test progress during a real Cargo download
        run: python experiments/real-download-hol.py --run --heli "${{ github.workspace }}/target/debug/cargo-heli${{ matrix.os == 'windows-latest' && '.exe' || '' }}" --output "${{ runner.temp }}/heli-real-download-hol"
      - name: Test automatic worktree homes and nested registry resolution
        run: python experiments/isolated-home-concurrency.py --run --heli "${{ github.workspace }}/target/debug/cargo-heli${{ matrix.os == 'windows-latest' && '.exe' || '' }}" --output "${{ runner.temp }}/heli-isolated-homes"
      - name: Test authenticated registry access from isolated homes
        run: python experiments/isolated-home-concurrency.py --run --authenticated --heli "${{ github.workspace }}/target/debug/cargo-heli${{ matrix.os == 'windows-latest' && '.exe' || '' }}" --output "${{ runner.temp }}/heli-isolated-homes-auth"
      - name: Preserve experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-epoch-views-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/heli-package-epoch-views/*.json
            ${{ runner.temp }}/heli-package-epoch-views/*.stdout
            ${{ runner.temp }}/heli-package-epoch-views/*.stderr
            ${{ runner.temp }}/heli-real-download-hol/**/*.json
            ${{ runner.temp }}/heli-real-download-hol/**/*.log
            ${{ runner.temp }}/heli-isolated-homes/**/*.json
            ${{ runner.temp }}/heli-isolated-homes/**/*.log
            ${{ runner.temp }}/heli-isolated-homes-auth/**/*.json
            ${{ runner.temp }}/heli-isolated-homes-auth/**/*.log
