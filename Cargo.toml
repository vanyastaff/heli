[package]
name = "cargo-heli"
version = "0.0.2"
edition = "2024"
rust-version = "1.99"
description = "Host-level scheduling for cargo on machines shared by many agents"
repository = "https://github.com/vanyastaff/heli"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cargo", "jobserver", "agents", "worktree", "build"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
exclude = ["/experiments", "/tests", "/.github", "/.claude", "/AGENTS.md", "/docs/agents", "/docs/research"]

# `cargo binstall cargo-heli` downloads the release archive the release
# workflow (`.github/workflows/release.yml`) attaches to `v<version>`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
regex = "1.12"
# Cargo's `{workspace-path-hash}`, to tell whose a build directory is.
rustc-stable-hash = "0.1"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order`: `setup` rewrites the user's JSON settings in their order.
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "display", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "net", "process"] }

# `mkfifo`, which rustix leaves out on Apple platforms; memory figures and the
# process list on macOS.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "2.1"
# `NtQuerySemaphore`, which windows-sys does not declare.
windows-link = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27"

# Pseudo-terminals, for the tests of output on a terminal.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["pty"] }

# Locate installed MSVC even when a shell omits ProgramFiles variables.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
