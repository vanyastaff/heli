[package]
name = "cargo-heli"
version = "0.0.0"
edition = "2024"
description = "Host-level scheduling for cargo on machines shared by many agents"
repository = "https://github.com/vanyastaff/heli"
# Not published until the first release decides the name and the license.
publish = false
exclude = ["/experiments", "/tests/fixtures"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
regex = "1.12"
serde ={ version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27"
